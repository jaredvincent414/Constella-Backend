services:
  postgres:
    image: postgres:16-alpine
    container_name: constella-postgres
    environment:
      POSTGRES_USER: constella
      POSTGRES_PASSWORD: constella
      POSTGRES_DB: constella
    ports:
      - "5433:5432"
    volumes:
      - constella-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U constella -d constella"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: constella-redis
    command: redis-server --save "" --appendonly no
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  constella-pgdata:
