[project]
name = "constella-backend"
version = "0.1.0"
description = "Cohort Matching Engine — similarity scoring, clustering, and constellation API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.2.0",
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "structlog>=24.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# One event loop for the whole session. The DB-backed tests share the app's
# engine, and asyncpg binds pooled connections to the loop that opened them —
# a per-test loop leaves the pool holding connections to a closed one.
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 flags function calls in argument defaults, which is exactly how FastAPI's
# Depends() and Query() are meant to be written.
ignore = ["B008"]

[tool.setuptools.packages.find]
include = ["app*"]
